# BigNetScreen Flatpak manifest.
#
# NetworkManager and firewalld live on the system bus, which the sandbox does
# not reach, so Miracast is unavailable here and the app says so. Screen
# capture goes through the ScreenCast portal only, never Mutter or KWin.
#
# Generate the Cargo sources before building, from this directory
# (https://github.com/flatpak/flatpak-builder-tools/tree/master/cargo):
#   python3 flatpak-cargo-generator.py ../../Cargo.lock -o cargo-sources.json
#   python3 flatpak-cargo-generator.py <gst-plugins-rs 0.15.4+fixup>/Cargo.lock \
#     -o gst-plugins-rs-sources.json

app-id: br.com.biglinux.BigNetScreen
runtime: org.gnome.Platform
# GNOME 50 is the first runtime with GTK 4.22 and libadwaita 1.9.
runtime-version: '50'
sdk: org.gnome.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable
command: bignetscreen

build-options:
  append-path: /usr/lib/sdk/rust-stable/bin
  env:
    CARGO_HOME: /run/build/bignetscreen/cargo

finish-args:
  # mDNS/SSDP discovery and every streaming transport.
  - --share=network
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri
  # System audio for the cast's audio track.
  - --socket=pulseaudio
  # Screen capture through the ScreenCast portal (no --talk-name for Mutter).
  # NDI announces and discovers sources through Avahi on the system bus; without
  # this a published stream is invisible to every receiver on the network.
  - --system-talk-name=org.freedesktop.Avahi

cleanup:
  - /include
  - /lib/pkgconfig
  - /share/man
  - '*.a'
  - '*.la'

modules:
  # whepserversink, for sharing with web browsers. The runtime has webrtcbin,
  # libnice and DTLS but not this plugin from gst-plugins-rs.
  - name: gst-plugin-webrtc
    buildsystem: simple
    build-options:
      env:
        CARGO_HOME: /run/build/gst-plugin-webrtc/cargo
        CARGO_NET_OFFLINE: 'true'
    build-commands:
      - cargo build --release --offline --locked -p gst-plugin-webrtc --lib --no-default-features --features whep,rustls-ring
      - install -Dm755 target/release/libgstrswebrtc.so -t /app/lib/gstreamer-1.0/
    sources:
      - type: git
        url: https://gitlab.freedesktop.org/gstreamer/gst-plugins-rs.git
        # 0.15.4 with a Cargo.lock that resolves gstreamer-rs from crates.io.
        tag: 0.15.4+fixup
        commit: c164a6696fcb0408f72a108e5f35ec25eb047464
      - gst-plugins-rs-sources.json

  - name: bignetscreen
    buildsystem: simple
    build-options:
      env:
        CARGO_NET_OFFLINE: 'true'
    build-commands:
      # `install` builds the binaries and the translations first.
      - make PREFIX=/app install CARGO_FLAGS="--release --offline --locked"
    sources:
      - type: dir
        path: ../..
        # Build output from the host would be copied into every build.
        skip:
          - target
          - build
          - .flatpak-builder
      - cargo-sources.json
