# Manifesto Flatpak do BigNetScreen.
#
# A structural limitation of the sandbox: NetworkManager and firewalld live on
# the **system** bus, which Flatpak does not grant access to. Therefore:
#
#   Chromecast → works fully (mDNS + TCP through --share=network)
#   Miracast   → unavailable; the app detects the sandbox and says so in the UI
#
# Screen capture goes exclusively through the portal (ashpd), never Mutter directly.
#
# Antes de construir, gere as fontes do Cargo:
#   python3 flatpak-cargo-generator.py Cargo.lock -o cargo-sources.json
# (https://github.com/flatpak/flatpak-builder-tools/tree/master/cargo)

app-id: br.com.biglinux.BigNetScreen
runtime: org.gnome.Platform
runtime-version: '49'
sdk: org.gnome.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable
command: bignetscreen

build-options:
  append-path: /usr/lib/sdk/rust-stable/bin
  env:
    CARGO_HOME: /run/build/bignetscreen/cargo

finish-args:
  # Descoberta mDNS e canal Cast.
  - --share=network
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri
  # System audio for the cast's audio track.
  - --socket=pulseaudio
  # Screen capture through the ScreenCast portal (no --talk-name for Mutter).
  - --talk-name=org.freedesktop.portal.Desktop
  # PipeWire: the portal hands over the fd, but the remote is still opened here.
  - --filesystem=xdg-run/pipewire-0:ro

cleanup:
  - /include
  - /lib/pkgconfig
  - /share/man
  - '*.a'
  - '*.la'

modules:
  - name: bignetscreen
    buildsystem: simple
    build-options:
      env:
        CARGO_NET_OFFLINE: 'true'
    build-commands:
      - cargo build --release --offline --locked
      - make PREFIX=/app DESTDIR= locale
      - make PREFIX=/app DESTDIR= install CARGO_FLAGS="--release --offline --locked"
    sources:
      - type: dir
        path: ../..
      - cargo-sources.json
