# BigNetScreen — Rust workspace
# A clean rewrite of the project (the C reference is no longer in tree).
[workspace]
resolver = "2"
members = [
    "crates/nd-core",
    "crates/nd-capture",
    "crates/nd-net",
    "crates/nd-chromecast",
    "crates/nd-wfd",
    "crates/nd-gui",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
authors = ["Tales A. Mendonça", "BigCommunity"]
repository = "https://github.com/big-comm/BigNetScreen"
rust-version = "1.80"

[workspace.dependencies]
# crates internos
nd-core = { path = "crates/nd-core" }
nd-capture = { path = "crates/nd-capture" }
nd-net = { path = "crates/nd-net" }
nd-chromecast = { path = "crates/nd-chromecast" }
nd-wfd = { path = "crates/nd-wfd" }

# comuns
thiserror = "2"
async-trait = "0.1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
futures = "0.3"
gstreamer = "0.25"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "net", "io-util", "time", "sync", "macros"] }

[profile.release]
opt-level = 3
# `thin`, not `fat`. Fat LTO hands the linker one combined object plus the
# rlibs that could not be merged — which is only `ring`, because it carries
# assembly compiled by its build script. Resolving symbols from that archive
# against an LTO'd object depends on the linker's behaviour, and the CI's
# `ld.lld` left every `ring_core_*` symbol undefined while the same code links
# here. Thin LTO removes the interaction and costs about 5% in binary size.
lto = "thin"
codegen-units = 1
strip = true
