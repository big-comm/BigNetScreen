# BigNetScreen — Rust workspace
# A clean rewrite of the project (the C reference is no longer in tree).
[workspace]
resolver = "2"
members = [
    "crates/nd-core",
    "crates/nd-capture",
    "crates/nd-net",
    "crates/nd-chromecast",
    "crates/nd-dlna",
    "crates/nd-wfd",
    "crates/nd-gui",
    "crates/nd-service",
    "crates/nd-ndi",
    "crates/nd-webrtc",
]
# Dependencies, not members: they keep upstream's own lint and format
# settings, and `--workspace` commands must not touch it.
exclude = ["vendor/gst-plugin-ndi", "vendor/relm4"]

[patch.crates-io]
relm4 = { path = "vendor/relm4" }

[workspace.package]
version = "0.1.4"
edition = "2024"
license = "GPL-3.0-or-later"
authors = ["Tales A. Mendonça", "BigCommunity"]
repository = "https://github.com/big-comm/BigNetScreen"
rust-version = "1.98.1"

[workspace.dependencies]
# Internal crates
nd-core = { path = "crates/nd-core" }
nd-capture = { path = "crates/nd-capture" }
nd-net = { path = "crates/nd-net" }
nd-chromecast = { path = "crates/nd-chromecast" }
nd-wfd = { path = "crates/nd-wfd" }
nd-ndi = { path = "crates/nd-ndi" }
nd-webrtc = { path = "crates/nd-webrtc" }
nd-dlna = { path = "crates/nd-dlna" }
nd-service = { path = "crates/nd-service" }

# Shared dependencies
thiserror = "2"
async-trait = "0.1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
futures = "0.3"
gstreamer = "0.25"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "net", "io-util", "time", "sync", "macros", "process", "signal"] }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
