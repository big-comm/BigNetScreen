[package]
name = "nd-gui"
description = "The BigNetScreen graphical application (relm4 + libadwaita)"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true
publish.workspace = true
default-run = "bignetscreen"

[[bin]]
name = "bignetscreen"
path = "src/main.rs"

[dependencies]
gstreamer.workspace = true
gstreamer-video = "0.25"
nd-core.workspace = true
nd-capture.workspace = true
nd-chromecast.workspace = true
nd-ndi.workspace = true
nd-webrtc.workspace = true
nd-service.workspace = true
# The window talks to the session service over the bus.
zbus = { version = "5", default-features = false, features = ["tokio"] }
nd-net.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
# The QR code with the page's address; only the matrix, drawn by hand into a texture.
qrcode = { version = "0.14", default-features = false }
futures.workspace = true
tokio = { workspace = true, features = ["process"] }
gettext-rs = { version = "0.8", features = ["gettext-system"] }
relm4 = { version = "0.11", features = ["libadwaita"] }
big-gtk-kit.workspace = true
# The floor big-gtk-kit requires.
adw = { package = "libadwaita", version = "0.9", features = ["v1_9"] }
gtk = { package = "gtk4", version = "0.11", features = ["v4_22"] }

[dev-dependencies]
async-trait.workspace = true

# The Rust library name is gettextrs; used by i18n.rs.
[package.metadata.cargo-machete]
ignored = ["gettext-rs"]
