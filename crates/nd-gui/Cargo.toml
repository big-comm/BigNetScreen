[package]
name = "nd-gui"
description = "The BigNetScreen graphical application (relm4 + libadwaita)"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true
default-run = "bignetscreen"

[[bin]]
name = "bignetscreen"
path = "src/main.rs"

[dependencies]
nd-core.workspace = true
nd-capture.workspace = true
nd-chromecast.workspace = true
nd-wfd.workspace = true
nd-net.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
futures.workspace = true
tokio.workspace = true
gettext-rs = { version = "0.7", features = ["gettext-system"] }
relm4 = { version = "0.11", features = ["libadwaita"] }
# Habilita a API da libadwaita ≥ 1.5 (AdwToolbarView, AdwBreakpoint, …).
# The system has 1.9.1; the 0.7 bindings expose up to v1_5.
adw = { package = "libadwaita", version = "0.9", features = ["v1_7"] }
