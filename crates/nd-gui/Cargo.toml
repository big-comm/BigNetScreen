[package]
name = "nd-gui"
description = "The BigNetScreen graphical application (relm4 + libadwaita)"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true
default-run = "bignetscreen"

[[bin]]
name = "bignetscreen"
path = "src/main.rs"

[dependencies]
gstreamer.workspace = true
gstreamer-video = "0.25"
nd-core.workspace = true
nd-capture.workspace = true
nd-chromecast.workspace = true
nd-wfd.workspace = true
nd-ndi.workspace = true
nd-webrtc.workspace = true
nd-net.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
# The QR code with the page's address; only the matrix, drawn by hand into a texture.
qrcode = { version = "0.14", default-features = false }
futures.workspace = true
tokio.workspace = true
gettext-rs = { version = "0.8", features = ["gettext-system"] }
relm4 = { version = "0.11", features = ["libadwaita"] }
# Habilita a API da libadwaita ≥ 1.5 (AdwToolbarView, AdwBreakpoint, …).
# The system has 1.9.1; the 0.7 bindings expose up to v1_5.
adw = { package = "libadwaita", version = "0.9", features = ["v1_7"] }
# The GTK version the bindings expose. The system has 4.22; `v4_10` is what
# `GtkFileDialog` and `GtkPicture::content-fit` need, and holding the floor
# there keeps the build working on distributions that are a few releases
# behind.
gtk = { package = "gtk4", version = "0.11", features = ["v4_10"] }

[dev-dependencies]
async-trait.workspace = true
