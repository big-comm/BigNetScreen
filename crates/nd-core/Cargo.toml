[package]
name = "nd-core"
description = "GUI-free core: the Provider/Sink/Capture traits, shared types and GStreamer pipeline construction"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
thiserror.workspace = true
async-trait.workspace = true
tracing.workspace = true
futures.workspace = true
gstreamer.workspace = true
# `radio`: radio silence shared between discovery and streaming.
tokio.workspace = true
# `stream_server`: handing a live TCP socket to `multisocketsink`.
# Media URLs use GLib's native URI parser, available since 2.66.
gio = { version = "0.22", features = ["v2_66"] }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
tracing-subscriber.workspace = true
