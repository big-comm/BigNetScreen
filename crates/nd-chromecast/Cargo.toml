[package]
name = "nd-chromecast"
description = "Provider e sink Chromecast: descoberta mDNS, canal Cast (protobuf/TLS) e servidor HTTP do stream"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
nd-core.workspace = true
thiserror.workspace = true
async-trait.workspace = true
tracing.workspace = true
futures.workspace = true
mdns-sd = "0.11"
prost = "0.13"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "net", "io-util", "time", "sync", "macros"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "logging", "tls12"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "logging"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# A implementar mais à frente na Fase 2 (servidor HTTP do stream):
# hyper = "1"   # serve o stream webm com token + allowlist de IP

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
