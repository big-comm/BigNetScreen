[package]
name = "nd-chromecast"
description = "Chromecast discovery over mDNS, the Cast control channel and the mirroring and HTTP streaming paths"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
nd-core.workspace = true
# `media`: a DLNA television handed a file it plays itself.
nd-dlna.workspace = true
async-trait.workspace = true
tracing.workspace = true
futures.workspace = true
gstreamer.workspace = true
gstreamer-app = "0.25"
mdns-sd = "0.21"
prost = "0.14"
tokio = { workspace = true, features = ["signal", "fs"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "logging", "tls12"] }
webpki = { package = "rustls-webpki", version = "0.103", default-features = false, features = ["std", "ring"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "logging"] }
serde_json = "1"
aes = "0.9"
ctr = "0.10"

[dev-dependencies]
# Signs the local test receiver's identity answers; already in the tree via rustls.
ring = "0.17"
nd-capture.workspace = true
nd-core.workspace = true
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
