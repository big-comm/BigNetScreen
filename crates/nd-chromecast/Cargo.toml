[package]
name = "nd-chromecast"
description = "Provider e sink Chromecast: descoberta mDNS, canal Cast (protobuf/TLS) e servidor HTTP do stream"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
nd-core.workspace = true
async-trait.workspace = true
tracing.workspace = true
futures.workspace = true
gstreamer.workspace = true
gstreamer-app = "0.25"
gio = "0.22"
mdns-sd = "0.20"
prost = "0.14"
tokio = { workspace = true, features = ["signal", "fs"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "logging", "tls12"] }
webpki = { package = "rustls-webpki", version = "0.103", default-features = false, features = ["std", "ring"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "logging"] }
serde_json = "1"
aes = "0.8"
ctr = "0.9"

[dev-dependencies]
nd-capture.workspace = true
nd-core.workspace = true
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
