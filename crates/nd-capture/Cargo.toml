[package]
name = "nd-capture"
description = "Backends de captura de tela: portal (ashpd) e Mutter direto (zbus)"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
nd-core.workspace = true
async-trait.workspace = true
tracing.workspace = true
tokio.workspace = true
zbus = { version = "5", default-features = false, features = ["tokio"] }
futures.workspace = true
enumflags2 = "0.7"
ashpd = { version = "0.13", default-features = false, features = ["tokio", "screencast"] }
# A virtual monitor only exists while something consumes its stream, so the
# Mutter backend keeps a minimal pipeline of its own alive.
gstreamer.workspace = true
# KDE has no portal call for "a virtual screen of this size" — the size is a
# literal in xdg-desktop-portal-kde. `zkde_screencast_unstable_v1` does take
# one, so on KWin we ask the compositor ourselves.
wayland-client = "0.31"
# The generated protocol code refers to it by name.
wayland-backend = "0.3"
wayland-scanner = "0.31"

[dev-dependencies]
# Examples only: the probes have to pick the encoder production would pick.
nd-net.workspace = true
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
gstreamer.workspace = true
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
gstreamer-app = "0.25"
