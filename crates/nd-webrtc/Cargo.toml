[package]
name = "nd-webrtc"
description = "Publishing the screen to any web browser on the network over WebRTC (WHEP)"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
nd-core.workspace = true
gstreamer.workspace = true
# The high-level WebRTC elements (`whepserversink`), linked statically like the
# NDI plugin. Only the WHEP signaller is built.
gst-plugin-webrtc = { version = "0.15.3", default-features = false, features = ["static", "whep"] }
async-trait.workspace = true
futures.workspace = true
tokio.workspace = true
tracing.workspace = true
# The small HTTP front door: the page, the PIN check and the WHEP proxy.
hyper = { version = "1", features = ["server", "client", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"
http = "1"
bytes = "1"

[dev-dependencies]
tracing-subscriber.workspace = true
tokio = { workspace = true, features = ["signal"] }
